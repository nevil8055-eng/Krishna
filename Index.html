<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Experience • Kisna Canteen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(145deg, #1a1210 0%, #2c1810 50%, #1f1410 100%);
    min-height: 100vh;
    color: #f5f0eb;
    padding: 16px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  .header {
    background: linear-gradient(135deg, #8b4513 0%, #a0522d 40%, #d4a574 100%);
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.6), transparent);
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .header .sub {
    font-size: 13px;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }
  .header .tagline {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.75;
  }
  .form { padding: 28px 22px 24px; }
  label {
    display: block;
    margin: 18px 0 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #e8d5c4;
    text-transform: uppercase;
  }
  input, textarea, select {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 12px;
    color: #f5f0eb;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.2s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #d4af37;
    background: rgba(255,255,255,0.1);
  }
  textarea { min-height: 90px; resize: vertical; }
  .stars {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 12px 0 6px;
  }
  .star {
    font-size: 36px;
    cursor: pointer;
    color: rgba(255,255,255,0.2);
    transition: all 0.15s;
  }
  .star.active { color: #f4c430; text-shadow: 0 0 12px rgba(244,196,48,0.4); }
  .check-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }
  .check-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 10px;
    padding: 12px;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .check-item input { width: auto; accent-color: #d4af37; }
  .check-item:has(input:checked) {
    background: rgba(212,175,55,0.12);
    border-color: #d4af37;
  }
  button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
    color: #1a1210;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
    letter-spacing: 0.3px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(212,175,55,0.3); }
  .result {
    display: none;
    padding: 28px 22px;
  }
  .result h3 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    margin-bottom: 16px;
    text-align: center;
  }
  .review-text {
    background: rgba(255,255,255,0.06);
    padding: 18px;
    border-radius: 14px;
    border: 1px solid rgba(212,175,55,0.2);
    line-height: 1.65;
    font-size: 15.5px;
    margin-bottom: 20px;
  }
  .actions { display: flex; gap: 10px; }
  .actions button { margin-top: 0; flex: 1; }
  .secondary {
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%) !important;
    color: white !important;
  }
  .regen {
    background: rgba(255,255,255,0.08) !important;
    color: #e8d5c4 !important;
    border: 1px solid rgba(212,175,55,0.3) !important;
    margin-top: 10px;
  }
  .note {
    font-size: 11.5px;
    color: rgba(245,240,235,0.55);
    text-align: center;
    padding: 8px 22px 22px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Kisna Canteen</h1>
    <div class="sub">Parimal Cross Road • Ahmedabad</div>
    <div class="tagline">Help us with a genuine review — AI writes it beautifully for you</div>
  </div>

  <div class="form" id="formSection">
    <label>Your Name <span style="font-weight:400;text-transform:none;opacity:0.6">(optional)</span></label>
    <input type="text" id="name" placeholder="e.g. Priya">

    <label>Your Rating</label>
    <div class="stars" id="stars">
      <span class="star active" data-value="1">★</span>
      <span class="star active" data-value="2">★</span>
      <span class="star active" data-value="3">★</span>
      <span class="star active" data-value="4">★</span>
      <span class="star active" data-value="5">★</span>
    </div>

    <label>What stood out for you?</label>
    <div class="check-grid">
      <label class="check-item"><input type="checkbox" name="highlight" value="food"> Delicious food</label>
      <label class="check-item"><input type="checkbox" name="highlight" value="service"> Warm & quick service</label>
      <label class="check-item"><input type="checkbox" name="highlight" value="ambiance"> Clean & pleasant vibe</label>
      <label class="check-item"><input type="checkbox" name="highlight" value="value"> Great value for money</label>
      <label class="check-item"><input type="checkbox" name="highlight" value="hygiene"> Excellent hygiene</label>
      <label class="check-item"><input type="checkbox" name="highlight" value="variety"> Good variety on menu</label>
    </div>

    <label>Occasion</label>
    <select id="occasion">
      <option value="">Just a meal</option>
      <option value="family">Family outing</option>
      <option value="friends">With friends</option>
      <option value="date">Special occasion / date</option>
      <option value="quick">Quick bite / lunch</option>
    </select>

    <label>Any dish or specific detail you loved? <span style="font-weight:400;text-transform:none;opacity:0.6">(optional)</span></label>
    <textarea id="details" placeholder="e.g. Patra Paneer was outstanding, staff remembered our preferences, pav bhaji was authentic..."></textarea>

    <button id="generateBtn">Generate Premium Review</button>
  </div>

  <div class="result" id="resultSection">
    <h3>Your Review</h3>
    <div class="review-text" id="reviewText"></div>
    <div class="actions">
      <button id="copyBtn">Copy Text</button>
      <button id="openBtn" class="secondary">Open Google Review</button>
    </div>
    <button id="regenBtn" class="regen">Generate Different Version</button>
    <button id="backBtn" class="regen" style="margin-top:8px;">← Edit My Answers</button>
  </div>

  <p class="note">After copying, open Google Review, select your stars, and paste the text. Genuine feedback helps Kisna Canteen serve you better.</p>
</div>

<script>
let selectedStars = 5;
const stars = document.querySelectorAll('.star');
stars.forEach(star => {
  star.addEventListener('click', () => {
    selectedStars = parseInt(star.dataset.value);
    stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.value) <= selectedStars));
  });
});

const intros = [
  "Had an absolutely wonderful time at Kisna Canteen on Parimal Cross Road!",
  "Just visited Kisna Canteen near Parimal Cross Road and it was a delightful experience.",
  "Kisna Canteen at Parimal Cross Road exceeded my expectations today.",
  "Really enjoyed my meal at Kisna Canteen, Parimal Cross Road.",
  "What a pleasant surprise — Kisna Canteen on Parimal Cross Road delivered beautifully.",
  "Stopped by Kisna Canteen Parimal Cross Road and left with a smile."
];

const foodPhrases = [
  "The food was full of authentic, bold flavours that felt homemade.",
  "Every dish we tried was delicious and perfectly seasoned.",
  "The taste was outstanding — fresh ingredients and great preparation.",
  "Food quality was top-notch with that comforting, home-style touch."
];

const servicePhrases = [
  "The staff was warm, polite, and genuinely attentive.",
  "Service was quick and friendly without being rushed.",
  "Team members were helpful and made us feel welcome.",
  "Excellent hospitality from the moment we walked in."
];

const ambiancePhrases = [
  "The place is clean, well-kept, and has a pleasant, comfortable vibe.",
  "Loved the clean ambiance and thoughtful seating.",
  "It felt neat, organised, and inviting.",
  "Hygiene and overall atmosphere were impressive."
];

const valuePhrases = [
  "Portion sizes and quality offered excellent value for the price.",
  "Great taste without burning a hole in the pocket.",
  "You get solid quality at very reasonable rates.",
  "Worth every rupee — fantastic value for money."
];

const closings = [
  "Will definitely be coming back soon. Highly recommended!",
  "Already planning our next visit. Don't miss this place!",
  "A must-try if you're in the area. Five stars from us.",
  "Left completely satisfied. Will recommend to friends and family.",
  "Perfect spot for a satisfying meal. Looking forward to returning."
];

function getSelectedHighlights() {
  return Array.from(document.querySelectorAll('input[name="highlight"]:checked')).map(cb => cb.value);
}

function generateReview(forceNew = false) {
  const name = document.getElementById('name').value.trim();
  const details = document.getElementById('details').value.trim();
  const occasion = document.getElementById('occasion').value;
  const highlights = getSelectedHighlights();

  // Shuffle and pick
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

  let sentences = [];

  // Intro
  let intro = pick(intros);
  if (name) intro = intro.replace("I ", name + " "); // light personalisation
  sentences.push(intro);

  // Occasion
  if (occasion === "family") sentences.push("Came here with family and everyone enjoyed it.");
  else if (occasion === "friends") sentences.push("Great place to catch up with friends.");
  else if (occasion === "date") sentences.push("Lovely setting for a special meal.");
  else if (occasion === "quick") sentences.push("Perfect for a quick, satisfying bite.");

  // Highlights (varied order)
  const highlightMap = {
    food: foodPhrases,
    service: servicePhrases,
    ambiance: ambiancePhrases,
    value: valuePhrases,
    hygiene: ["Hygiene standards were excellent throughout.", "Everything felt clean and well-maintained."],
    variety: ["Good variety on the menu — something for everyone.", "Appreciated the range of options available."]
  };

  shuffle(highlights).forEach(h => {
    if (highlightMap[h]) sentences.push(pick(highlightMap[h]));
  });

  // Custom details
  if (details) sentences.push(details.endsWith('.') ? details : details + '.');

  // Closing based on stars
  if (selectedStars >= 4) sentences.push(pick(closings));
  else if (selectedStars === 3) sentences.push("Overall a decent experience. Hope to see continued consistency.");
  else sentences.push("There is room for improvement, but sharing honest feedback.");

  // Join with natural flow
  const review = sentences.join(' ');

  document.getElementById('reviewText').textContent = review;
  document.getElementById('formSection').style.display = 'none';
  document.getElementById('resultSection').style.display = 'block';
}

document.getElementById('generateBtn').addEventListener('click', () => generateReview());
document.getElementById('regenBtn').addEventListener('click', () => generateReview(true));
document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('reviewText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1800);
  });
});
document.getElementById('openBtn').addEventListener('click', () => {
  // Direct Google review form using the Place ID
  const reviewUrl = 'https://search.google.com/local/writereview?placeid=ChIJQ0O_Oy-FXjkRJRd8iaz-PFw';
  window.open(reviewUrl, '_blank');
});
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('formSection').style.display = 'block';
});
</script>
</body>
</html>
